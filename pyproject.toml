[project]
name = "trading-agent"
version = "0.1.0"
description = "Local paper-trading crypto agent (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "keyring>=25,<27",
    "numpy>=2,<3",
    "openai>=1,<3",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest-socket>=0.8.1",
    "pandas>=2,<3",
    "pandas-stubs>=2,<3",
    "types-pyyaml>=6,<7",
    "pytest-xdist>=3.6,<4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
src = ["backend"]
# Protected files: never let the formatter touch spec/design/prompt docs.
exclude = ["docs", "design", "backend/prompts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "E722", "BLE001", "S110", "TRY400", "TRY203", "LOG"]

[tool.mypy]
mypy_path = "backend"
packages = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
markers = [
    "slow: long-running soaks; excluded from the suite, run via `make soak`",
]
# No real network in tests: every outbound socket fails unless it's localhost.
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost"
filterwarnings = [
    'error:A test tried to use socket\.socket',
    # Warnings raised from app.* are errors, so a new one fails CI.
    'error:::app\..*',
]
