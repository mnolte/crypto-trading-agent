name: Set up the frontend
description: >
  Node 22, pnpm through corepack (the version pinned in frontend/package.json),
  the pnpm store cache and a frozen install in frontend/. Used by every job
  that needs the frontend, so the setup is written once.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - shell: bash
      run: corepack enable
    - name: Locate pnpm store
      id: pnpm-store
      shell: bash
      working-directory: frontend
      run: echo "dir=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.dir }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-
    - shell: bash
      working-directory: frontend
      run: corepack pnpm install --frozen-lockfile
