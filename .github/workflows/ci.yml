name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # pytest runs with --disable-socket --allow-hosts=127.0.0.1,localhost
      # (addopts in pyproject.toml): any real outbound call fails.
      - run: uv run pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:run
      - run: corepack pnpm build

  api-types:
    name: api-types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: uv sync --frozen
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: (cd frontend && corepack pnpm install --frozen-lockfile)
      # Regenerate both artifacts, then fail if the tree changed.
      - name: Regenerate openapi.json and schema.d.ts
        run: |
          mkdir -p "$TA_DATA_DIR"
          uv run python -c 'import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))' > openapi.json
          (cd frontend && corepack pnpm run gen:types)
          git status --porcelain -- openapi.json frontend/src/api/schema.d.ts
          git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: uv sync --frozen
        working-directory: .
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      # The app serves the built SPA — dist/ must exist for the suite to load a page.
      - run: corepack pnpm build
      - run: corepack pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Check protected paths
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if ! grep -qE '^(docs/SPEC\.md|docs/CHANGES\.md|design/|backend/prompts/)' /tmp/changed.txt; then
            echo "No protected files changed."
            exit 0
          fi
          if echo '${{ toJSON(github.event.pull_request.labels.*.name) }}' | grep -q '"spec-change"'; then
            echo "Protected files changed, but 'spec-change' label is present."
            exit 0
          fi
          echo "::error::Protected files changed without the 'spec-change' label:"
          grep -E '^(docs/SPEC\.md|docs/CHANGES\.md|design/|backend/prompts/)' /tmp/changed.txt
          exit 1

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs token permissions beyond contents:read, so the
      # binary is run directly — pinned version, checksum-verified.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan changed commits for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..HEAD"
          else
            RANGE="--all"
          fi
          /tmp/gitleaks git -v --log-opts="$RANGE" .
