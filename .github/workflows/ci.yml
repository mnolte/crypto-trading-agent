name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Monday 05:17 UTC: a weekly full run.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels its stale run; every commit on main keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Python comes from .python-version (3.12); uv installs it if the runner lacks it.
# The spec label check and the PR title check are in spec-label.yml, the
# dependency audits in audit.yml.

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      # Fails on unformatted code; run `make fix` (or the pre-commit hook) before committing.
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # pytest runs with --disable-socket --allow-hosts=127.0.0.1,localhost
      # (addopts in pyproject.toml): any real outbound call fails.
      # The slow tests run in the backend-slow job below.
      - run: uv run pytest -m "not slow" -n auto --dist load

  backend-slow:
    # The 2000-cycle soak (marker "slow", about 2 minutes): on every PR push as
    # well, because CI runs every suite and the laptop never does (item 024,
    # AGENTS.md → Commands). It runs beside the other jobs, so it adds no wait.
    name: backend-slow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m slow -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-frontend
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test:run
      - run: corepack pnpm build

  api-types:
    name: api-types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: ./.github/actions/setup-frontend
      # Regenerate both artifacts, then fail if the tree changed.
      - name: Regenerate openapi.json and schema.d.ts
        run: |
          mkdir -p "$TA_DATA_DIR"
          uv run python -c 'import json; from app.main import app; print(json.dumps(app.openapi(), indent=2, sort_keys=True))' > openapi.json
          (cd frontend && corepack pnpm run gen:types)
          git status --porcelain -- openapi.json frontend/src/api/schema.d.ts
          git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts

  e2e:
    # Runs in parallel with backend and frontend: it builds what it needs itself.
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TA_DATA_DIR: /tmp/ta-data
      TA_DB_PATH: /tmp/ta-data/agent.db
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: .
      - uses: ./.github/actions/setup-frontend
      # The browser download is cached; the system packages are installed each run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: corepack pnpm exec playwright install --with-deps chromium
      # The app serves the built SPA — dist/ must exist for the suite to load a page.
      - run: corepack pnpm build
      - run: corepack pnpm e2e
      # What the page showed when a test failed, readable in the log without
      # downloading the report.
      - name: Show failure context
        if: failure()
        run: |
          find test-results -name error-context.md -print0 |
            while IFS= read -r -d '' f; do
              echo "::group::$f"; cat "$f"; echo "::endgroup::"
            done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs token permissions beyond contents:read, so the
      # binary is run directly — pinned version, checksum-verified.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan changed commits for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && \
               [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="--all"
          fi
          /tmp/gitleaks git -v --log-opts="$RANGE" .
