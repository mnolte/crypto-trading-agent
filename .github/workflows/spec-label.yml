name: Workflow

# Checks on the PR itself, not the code:
#   spec-label  — spec-owned paths need the "spec change" label and a change
#                 entry (.github/scripts/check-spec-label.sh, paths in
#                 .github/spec-paths.txt). Fails the PR.
#   names       — title and branch follow docs/work-items.md. Warnings only.

on:
  pull_request:
    # labeled/unlabeled: adding the label must clear a failure and removing it
    # must bring it back, without a new push. edited: a changed title.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec-label:
    name: spec-label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check spec label and changelogs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'spec change') }}
        run: bash .github/scripts/check-spec-label.sh

  names:
    name: names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check title and branch
        # Passed through env, never pasted into the script: a title is user text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash .github/scripts/check-pr-name.sh
