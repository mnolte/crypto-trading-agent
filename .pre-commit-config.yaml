# Fixes and checks before each commit, the same ones CI runs in the backend job.
# Install once per clone:  make hooks   (or: uvx pre-commit install)
# The hooks call the ruff from uv.lock, so the version always matches CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
